[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytepair"
version = "0.1.0"
description = "Byte-level BPE tokenizer from scratch, compatible with GPT-4's cl100k_base"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Carapic" }]
requires-python = ">=3.10"
dependencies = ["regex>=2023.0"]
keywords = ["bpe", "tokenizer", "gpt", "nlp", "tiktoken"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bytepair = "bytepair.cli:main"

[project.urls]
Homepage = "https://stxqq.github.io/bytepair/"
Source = "https://github.com/Stxqq/bytepair"

[tool.hatch.build.targets.sdist]
include = ["bytepair", "tests", "examples/alice.txt", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# zip(ids, ids[1:]) is deliberately uneven
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
